name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Validate extension safety boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Restore locked metadata
        run: npm ci

      - name: Run repository quality gate
        env:
          # GitHub-hosted CPU capacity varies; local release gates retain the strict 1x budgets.
          MEDIA_SCOUT_PERF_BUDGET_MULTIPLIER: '2'
        run: npm run check

      - name: Build extension staging directory
        run: npm run build

      - name: Inspect package, documentation, license, and provenance
        run: npm run artifact:inspect

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file gitleaks.tar.gz gitleaks

      - name: Scan Git history for secrets
        run: ./gitleaks git --redact --no-banner --verbose

      - name: Upload verified extension staging directory
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: media-scout-extension-staging
          path: dist/media-scout-downloader
          if-no-files-found: error

      - name: Upload coverage and performance evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-evidence
          path: |
            coverage/coverage-summary.json
            test-results/performance/*.json
          if-no-files-found: error
